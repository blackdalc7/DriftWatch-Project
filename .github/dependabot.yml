# Grouped monthly so updates arrive as one PR per ecosystem.
version: 2
updates:
  - {package-ecosystem: pip, directory: "/", schedule: {interval: monthly}, open-pull-requests-limit: 2, groups: {pip: {patterns: ["*"]}}}
  - {package-ecosystem: gomod, directory: "/agent", schedule: {interval: monthly}, open-pull-requests-limit: 2, groups: {gomod: {patterns: ["*"]}}}
  - {package-ecosystem: npm, directory: "/web", schedule: {interval: monthly}, open-pull-requests-limit: 2, groups: {npm: {patterns: ["*"]}}}
  - {package-ecosystem: github-actions, directory: "/", schedule: {interval: monthly}, open-pull-requests-limit: 2, groups: {github-actions: {patterns: ["*"]}}}
  - {package-ecosystem: docker, directory: "/deploy", schedule: {interval: monthly}, open-pull-requests-limit: 2, groups: {docker: {patterns: ["*"]}}}
