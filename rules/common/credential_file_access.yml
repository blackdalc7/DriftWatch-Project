title: Access to a file that looks like a password store
id: 5f2b1c0e-6a41-4c7e-9b8a-1d2e3f4a5b07
status: stable
description: Detects reads of files named like plaintext password lists. Needs file access auditing (Windows SACL 4663 or auditd watch).
author: Driftwatch
date: 2026-10-30
tags:
  - attack.credential-access
  - attack.t1552.001
logsource:
  category: file_access
detection:
  selection:
    TargetFilename|contains: 'passwords'
    TargetFilename|endswith: '.txt'
  condition: selection
falsepositives:
  - Users opening their own notes
level: medium
