title: Whoami /all execution
id: 5f2b1c0e-6a41-4c7e-9b8a-1d2e3f4a5b01
status: stable
description: Detects whoami.exe run with /all, a common first step after initial access to enumerate privileges and groups.
author: Driftwatch
date: 2026-10-30
tags:
  - attack.discovery
  - attack.t1033
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\whoami.exe'
    CommandLine|contains: '/all'
  condition: selection
falsepositives:
  - Administrators troubleshooting group membership
level: medium
