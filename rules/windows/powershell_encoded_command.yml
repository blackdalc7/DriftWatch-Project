title: PowerShell started with an encoded command
id: 5f2b1c0e-6a41-4c7e-9b8a-1d2e3f4a5b05
status: stable
description: Detects powershell.exe or pwsh.exe launched with -EncodedCommand or its short forms.
author: Driftwatch
date: 2026-10-30
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|contains|windash:
      - ' -EncodedCommand '
      - ' -enc '
      - ' -ec '
  condition: selection_img and selection_flag
falsepositives:
  - Some management agents encode their commands
level: high
