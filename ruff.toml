# Lint configuration (ruff), including bandit-equivalent security rules (S).
line-length = 120
target-version = "py310"
extend-exclude = ["web", "agent"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = [
  "S101",   # assert is how pytest works
  "S311",   # random is used for schedule jitter, never for secrets
  "RUF001", "RUF002", "RUF003",
  "SIM105",
  "B008",   # FastAPI dependency injection uses calls in defaults
]

[lint.per-file-ignores]
"**/tests/**" = ["S", "B", "BLE"]

[lint.isort]
known-first-party = ["driftwatch"]
